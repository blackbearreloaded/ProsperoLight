name: Build

on:
  push:
    branches:
      - main
    tags:
      - "[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-format-18 clang-tidy-18 cmake lld-18 make pkg-config tar unzip wget

      - name: Read app identity and version
        shell: bash
        run: |
          metadata=$(python3 -c 'import json; p=json.load(open("sce_sys/param.json")); print(p["titleId"], p["contentVersion"])')
          read -r title_id content_version <<< "$metadata"
          [[ $title_id =~ ^PPSA[0-9]{5}$ ]] || exit 2
          [[ $content_version =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]] || exit 2
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$content_version" ]]; then
            echo "Release tag must exactly match param.json contentVersion: $content_version" >&2
            exit 2
          fi
          echo "TITLE_ID=$title_id" >> "$GITHUB_ENV"
          echo "CONTENT_VERSION=$content_version" >> "$GITHUB_ENV"

      - name: Lint source and metadata
        run: make lint

      - name: Run host GoogleTest suite
        run: make test-unit

      - name: Run host integration tests
        run: make test-integration

      - name: Reproduce clean-room runtime shim
        run: make libc

      - name: Verify generated runtime is unchanged
        run: cd runtime && sha256sum -c libc.prx.sha256

      - name: Build all output formats
        run: make packages

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prosperolight-${{ github.sha }}
          path: |
            dist/${{ env.TITLE_ID }}/
            dist/${{ env.TITLE_ID }}.ffpkg
            dist/${{ env.TITLE_ID }}.ffpfsc
            runtime/libc.prx
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "prosperolight-$GITHUB_SHA"
          --dir release

      - name: Prepare release assets
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cd release
          shopt -s nullglob
          images=(dist/PPSA*.ffpfsc)
          ufs_images=(dist/PPSA*.ffpkg)
          app_dirs=(dist/PPSA*/)
          runtime="runtime/libc.prx"
          if (( ${#images[@]} != 1 || ${#ufs_images[@]} != 1 || ${#app_dirs[@]} != 1 )) || [[ ! -f $runtime ]]; then
            echo "Expected one FFPFSC image, one FFPKG image, one app folder, and libc.prx." >&2
            exit 1
          fi
          title_id="${app_dirs[0]#dist/}"
          title_id="${title_id%/}"
          folder_archive="${title_id}-folder.zip"
          (cd dist && python3 -m zipfile -c "../$folder_archive" "$title_id")
          sha256sum "${images[0]}" "${ufs_images[0]}" "$folder_archive" |
            sed 's#  dist/#  #' > SHA256SUMS
          sha256sum "$runtime" | sed 's#  runtime/libc.prx#  libc.prx#' >> SHA256SUMS
          echo "image=${images[0]}" >> "$GITHUB_OUTPUT"
          echo "ufs_image=${ufs_images[0]}" >> "$GITHUB_OUTPUT"
          echo "folder=$folder_archive" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.package.outputs.image }}
          UFS_IMAGE: ${{ steps.package.outputs.ufs_image }}
          FOLDER: ${{ steps.package.outputs.folder }}
          RUNTIME: ${{ steps.package.outputs.runtime }}
        shell: bash
        run: |
          set -euo pipefail
          assets=("release/$IMAGE" "release/$UFS_IMAGE" "release/$FOLDER" "release/$RUNTIME" "release/SHA256SUMS")
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "ProsperoLight $GITHUB_REF_NAME"
          fi
