name: Host tooling

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch pinned SharpProspero tooling
        shell: pwsh
        run: ./tools/setup-tooling.ps1
      - name: Build NativeAppBuilder
        run: dotnet build tooling/NativeAppBuilder/NativeAppBuilder.csproj -c Release
      - name: Reproduce clean-room runtime shim
        shell: pwsh
        run: ./tools/rebuild-libc.ps1
      - name: Verify generated artifact is unchanged
        shell: pwsh
        run: git diff --exit-code -- runtime/libc.prx runtime/libc.prx.sha256
